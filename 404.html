<!doctype html><meta charset="utf-8">
<title>Redirecting…</title>
<meta name="robots" content="noindex">
<script>
    // Save the original path so Flutter can restore it
    sessionStorage.setItem('flutter_spa_path',
      location.pathname + location.search + location.hash);
    // Go to app entry (root)
    location.replace('/');
</script>
<noscript><a href="/">Go to home</a></noscript>
